# Example nginx site for PetXport. Replace the server_name and certificate paths.
# The app itself listens on 127.0.0.1:3000 and serves both the API and the web app.
# X-Forwarded-For is set to the real peer address (not appended to whatever the client sent),
# which is what the app's rate limits rely on.

# Per-address ceilings in front of the app's own limits. These two lines belong in the http {} block.
limit_req_zone $binary_remote_addr zone=petxport:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=petxport_conn:10m;

server {
    listen 80;
    server_name transport.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name transport.example.org;

    ssl_certificate     /etc/letsencrypt/live/transport.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transport.example.org/privkey.pem;

    client_max_body_size 2m;
    limit_req zone=petxport burst=60 nodelay;
    limit_conn petxport_conn 40;

    # Invitation, reset and confirmation links contain a secret; do not write them to the access log.
    location ~ ^/(invite|reset|verify|api/invites)/ {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Planning a long route can take a while.
        proxy_read_timeout 120s;
    }

    # Live chat uses a WebSocket.
    location /api/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }
}
